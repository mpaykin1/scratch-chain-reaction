<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Real 2.5D Game Fragments</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="gallery">
    <section class="scene" data-game="caapora">
      <img class="location" src="./assets/caapora-location.png" alt="Caapora 2.5D game location">
      <h1>Caapora 2.5D</h1>
      <canvas class="actor" aria-label="Original Caapora running animation"></canvas>
      <a class="source" href="https://github.com/CaaporaGames/Caapora2.5D" target="_blank" rel="noreferrer">SOURCE</a>
    </section>

    <section class="scene" data-game="moral">
      <img class="location" src="./assets/moral-location.jpg" alt="Moral Matrix game location">
      <h1>Moral Matrix</h1>
      <canvas class="actor" aria-label="Original Moral Matrix walk animation"></canvas>
      <a class="source" href="https://github.com/sedmugen/moral-matrix" target="_blank" rel="noreferrer">SOURCE</a>
    </section>

    <section class="scene" data-game="flare">
      <img class="location" src="./assets/flare-location.jpg" alt="Flare Empyrean Campaign game location">
      <h1>Flare: Empyrean Campaign</h1>
      <canvas class="actor" aria-label="Original Flare character animation"></canvas>
      <a class="source" href="https://github.com/flareteam/flare-game" target="_blank" rel="noreferrer">SOURCE</a>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>

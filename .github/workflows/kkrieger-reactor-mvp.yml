name: Kkrieger Reactor MVP

on:
  push:
    branches: ["feat/kkrieger-reactor-mvp-20260930", main]
    paths:
      - "tools/kkrieger-reactor-mvp/**"
      - ".github/workflows/kkrieger-reactor-mvp.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/kkrieger-reactor-mvp/**"
      - ".github/workflows/kkrieger-reactor-mvp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kkrieger-reactor-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  level-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact Krieger source
        uses: actions/checkout@v4
        with:
          repository: MasonDye/kkrieger-wasm
          ref: 3bf0ff017372e640e966c2785a4d95a998cec242
          path: .upstream/kkrieger-wasm

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      - name: Build native Krieger reactor MVP
        run: bash tools/kkrieger-reactor-mvp/build.sh .upstream/kkrieger-wasm

      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.63.0 pngjs@7.0.0
          node node_modules/playwright/cli.js install chromium

      - name: Upload compiled reactor before visual gate
        uses: actions/upload-artifact@v4
        with:
          name: kkrieger-reactor-build-${{ github.sha }}
          path: work/kkrieger-reactor-mvp/index.html
          retention-days: 7

      - name: Serve Reactor MVP
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 --directory work/kkrieger-reactor-mvp >/tmp/kkrieger-reactor-mvp-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8767/index.html >/dev/null && break
            sleep 1
          done

      - name: Prove geometry collision movement look and portrait
        env:
          KK_URL: http://127.0.0.1:8767/index.html
          KK_SCREENSHOT: work/kkrieger-reactor-mvp/reactor-mvp.png
        run: node tools/kkrieger-reactor-mvp/reactor-mvp-smoke.mjs

      - name: Upload Reactor MVP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kkrieger-reactor-mvp-${{ github.sha }}
          path: |
            work/kkrieger-reactor-mvp/index.html
            work/kkrieger-reactor-mvp/reactor-mvp.png
          retention-days: 14

      - name: Publish separate permanent Reactor MVP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p kkrieger-reactor-mvp
          cp work/kkrieger-reactor-mvp/index.html kkrieger-reactor-mvp/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kkrieger-reactor-mvp/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(kkrieger): publish Reactor MVP [skip ci]"
            git push origin HEAD:main
          fi

      - name: Wait for exact public bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LIVE_URL: https://mpaykin1.github.io/scratch-chain-reaction/kkrieger-reactor-mvp/
        run: |
          local_sha="$(sha256sum work/kkrieger-reactor-mvp/index.html | awk '{print $1}')"
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fLsS --max-time 30 "$LIVE_URL?build=$GITHUB_SHA" -o /tmp/live-level-lab.html; then
              live_sha="$(sha256sum /tmp/live-level-lab.html | awk '{print $1}')"
              if [ "$live_sha" = "$local_sha" ]; then
                echo "REACTOR_MVP_LIVE_EXACT_BYTES_PASS attempt=$attempt"
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Re-prove custom level on permanent public URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KK_URL: https://mpaykin1.github.io/scratch-chain-reaction/kkrieger-reactor-mvp/
          KK_SCREENSHOT: work/kkrieger-reactor-mvp/live-reactor-mvp.png
        run: node tools/kkrieger-reactor-mvp/reactor-mvp-smoke.mjs

      - name: Upload live Reactor MVP proof
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kkrieger-live-reactor-mvp-${{ github.sha }}
          path: work/kkrieger-reactor-mvp/live-reactor-mvp.png
          if-no-files-found: ignore
          retention-days: 14

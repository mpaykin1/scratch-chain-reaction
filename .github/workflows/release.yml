name: Scratch release gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  responsive-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python test_native_scratch.py
      - name: Causal simulator regression tests
        run: node --test test/scenario-engine.test.mjs
      - name: Reactive world engine regression tests
        run: node --test test/world-engine.test.mjs
      - name: Cinematic state, idea, offline and Genie regression tests
        run: npm run test:cinematic
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/scratch-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
      - name: Living Watercolor worker V2 browser gate
        run: node test/living-watercolor-worker-v2.browser.cjs
        env:
          CI: 'true'
          BASE_URL: http://127.0.0.1:8765
      - name: Desktop, portrait, landscape and gameplay
        run: node qa_release.cjs
        env:
          CI: 'true'
      - name: Cinematic accessibility, economy and portable-save browser gates
        run: node test_cinematic_enhancements.cjs && node test/portable-ui.cjs
        env:
          CI: 'true'
      - name: Reactive follow-up events and 85% screen visibility
        run: node test/world-ui.cjs
        env:
          CI: 'true'
      - name: End-to-end water-crisis scenario on three screen sizes
        run: node test/scenario-ui.cjs
        env:
          CI: 'true'
          BASE_URL: http://127.0.0.1:8765
          ARTIFACT_DIR: scenario-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratch-visual-qa
          path: |
            qa-artifacts/*.png
            scenario-qa/*.png
          if-no-files-found: ignore
          retention-days: 5

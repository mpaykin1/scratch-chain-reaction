name: Scratch release gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  responsive-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python test_native_scratch.py
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/scratch-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
      - name: Desktop, portrait, landscape and gameplay
        run: node qa_release.cjs
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratch-visual-qa
          path: qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 5

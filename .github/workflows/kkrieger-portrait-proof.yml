name: Kkrieger Portrait Proof

on:
  push:
    branches: ["feat/kkrieger-portrait-proof-20260929", main]
    paths:
      - "tools/kkrieger-portrait-proof/**"
      - ".github/workflows/kkrieger-portrait-proof.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/kkrieger-portrait-proof/**"
      - ".github/workflows/kkrieger-portrait-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kkrieger-portrait-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact Krieger source
        uses: actions/checkout@v4
        with:
          repository: MasonDye/kkrieger-wasm
          ref: 3bf0ff017372e640e966c2785a4d95a998cec242
          path: .upstream/kkrieger-wasm

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      - name: Build autonomous portrait proof
        run: bash tools/kkrieger-portrait-proof/build.sh .upstream/kkrieger-wasm

      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.63.0 pngjs@7.0.0
          node node_modules/playwright/cli.js install chromium

      - name: Serve proof
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory work/kkrieger-portrait-proof >/tmp/portrait-proof-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8766/index.html >/dev/null && break
            sleep 1
          done

      - name: Prove real 3D portrait coverage above 85 percent
        env:
          KK_URL: http://127.0.0.1:8766/index.html
          KK_SCREENSHOT: work/kkrieger-portrait-proof/portrait-proof.png
        run: node tools/kkrieger-portrait-proof/portrait-proof-smoke.mjs

      - name: Upload proof evidence
        uses: actions/upload-artifact@v4
        with:
          name: kkrieger-portrait-proof-${{ github.sha }}
          path: |
            work/kkrieger-portrait-proof/index.html
            work/kkrieger-portrait-proof/portrait-proof.png
          retention-days: 14

      - name: Publish separate permanent proof page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p kkrieger-portrait-proof
          cp work/kkrieger-portrait-proof/index.html kkrieger-portrait-proof/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kkrieger-portrait-proof/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(kkrieger): publish portrait proof [skip ci]"
            git push origin HEAD:main
          fi

      - name: Wait for exact public bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LIVE_URL: https://mpaykin1.github.io/scratch-chain-reaction/kkrieger-portrait-proof/
        run: |
          local_sha="$(sha256sum work/kkrieger-portrait-proof/index.html | awk '{print $1}')"
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fLsS --max-time 30 "$LIVE_URL?build=$GITHUB_SHA" -o /tmp/live-proof.html; then
              live_sha="$(sha256sum /tmp/live-proof.html | awk '{print $1}')"
              if [ "$live_sha" = "$local_sha" ]; then
                echo "PORTRAIT_PROOF_LIVE_EXACT_BYTES_PASS attempt=$attempt"
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Re-prove portrait on the permanent public URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KK_URL: https://mpaykin1.github.io/scratch-chain-reaction/kkrieger-portrait-proof/
          KK_SCREENSHOT: work/kkrieger-portrait-proof/live-portrait-proof.png
        run: node tools/kkrieger-portrait-proof/portrait-proof-smoke.mjs

      - name: Upload live portrait evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kkrieger-live-portrait-proof-${{ github.sha }}
          path: work/kkrieger-portrait-proof/live-portrait-proof.png
          if-no-files-found: ignore
          retention-days: 14

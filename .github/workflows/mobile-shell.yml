name: Scratch mobile shell
on:
  pull_request:
    paths:
      - 'index.html'
      - 'play.html'
      - 'manifest.webmanifest'
      - 'test_mobile_shell.py'
      - '.github/workflows/mobile-shell.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'play.html'
      - 'manifest.webmanifest'
      - 'test_mobile_shell.py'
      - '.github/workflows/mobile-shell.yml'
jobs:
  static-mobile-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate HTML shell, PWA manifest and project URL
        run: python -m unittest -v test_mobile_shell.py
